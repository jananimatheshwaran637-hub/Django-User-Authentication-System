{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Edit Supplier</h2>


    <div class="card mt-3">

        <div class="card-body">


            <form method="POST">

                {% csrf_token %}


                {{ form.as_p }}


                <button type="submit" class="btn btn-success">

                    Update Supplier

                </button>


                <a href="{% url 'suppliers' %}" class="btn btn-secondary">

                    Cancel

                </a>


            </form>


        </div>

    </div>


</div>


{% endblock %}
