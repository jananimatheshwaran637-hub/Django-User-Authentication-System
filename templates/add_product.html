{% extends 'base.html' %}

{% block title %}Add Product{% endblock %}

{% block content %}

<div class="container-fluid">

    <h2>Add Product</h2>

    <div class="card shadow mt-3">

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}


                <div class="mb-3">
                    <label>Product Name</label>

                    <input type="text"
                           class="form-control"
                           name="name"
                           required>
                </div>


                <div class="mb-3">
                    <label>Unit</label>

                    <input type="text"
                           class="form-control"
                           name="unit"
                           required>
                </div>


                <div class="mb-3">
                    <label>Price</label>

                    <input type="number"
                           class="form-control"
                           name="price"
                           required>
                </div>


                <div class="mb-3">
                    <label>GST</label>

                    <input type="number"
                           class="form-control"
                           name="gst"
                           required>
                </div>


                <div class="mb-3">
                    <label>Stock</label>

                    <input type="number"
                           class="form-control"
                           name="stock"
                           required>
                </div>


                <div class="mb-3">
                    <label>Product Image</label>

                    <input type="file"
                           class="form-control"
                           name="image">
                </div>


                <button type="submit" class="btn btn-primary">
                    Save Product
                </button>


            </form>

        </div>

    </div>

</div>

{% endblock %}
