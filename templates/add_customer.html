{% extends 'base.html' %}

{% block title %}Add Customer{% endblock %}

{% block content %}

<div class="container-fluid">

    <h2>Add Customer</h2>

    <div class="card shadow mt-3">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Save Customer
                </button>

                <a href="{% url 'customers' %}" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
