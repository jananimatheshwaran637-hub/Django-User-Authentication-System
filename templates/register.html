{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
background:#eef2f7;
font-family:Poppins,sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.register-box{
width:950px;
background:#fff;
display:flex;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.left{
width:45%;
background:linear-gradient(135deg,#0d6efd,#00b4db);
color:#fff;
padding:50px;
display:flex;
flex-direction:column;
justify-content:center;
}

.left h1{
font-size:40px;
font-weight:bold;
}

.left p{
margin-top:20px;
font-size:16px;
}

.right{
width:55%;
padding:40px;
}

.form-control{
height:48px;
border-radius:10px;
}

.btn-register{
height:50px;
width:100%;
border-radius:10px;
font-size:18px;
}

@media(max-width:768px){
.register-box{
flex-direction:column;
width:95%;
}
.left,.right{
width:100%;
}
}
</style>

</head>

<body>

<div class="register-box">

<div class="left">
<h1>Nova ERP</h1>

<p>Create your account to access the ERP Dashboard.</p>

<p>Manage Products, Customers, Billing, Payments and Reports.</p>

</div>

<div class="right">

<h2 class="text-center mb-4">Register</h2>

<form method="POST">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">
<label>Full Name</label>
<input type="text" name="fullname" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Username</label>
<input type="text" name="username" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Phone</label>
<input type="text" name="phone" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label>Password</label>

<div class="input-group">

<input type="password"
id="pass1"
name="password"
class="form-control"
required>

<button type="button"
class="btn btn-outline-secondary"
onclick="showPass1()">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

<div class="col-md-6 mb-3">

<label>Confirm Password</label>

<div class="input-group">

<input type="password"
id="pass2"
name="confirm_password"
class="form-control"
required>

<button type="button"
class="btn btn-outline-secondary"
onclick="showPass2()">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

</div>

<button class="btn btn-primary btn-register">

Register

</button>

<div class="text-center mt-4">

Already have an account?

<a href="{% url 'login' %}">

Login

</a>

</div>

</form>

</div>

</div>

<script>

function showPass1(){

var x=document.getElementById("pass1");

if(x.type==="password"){
x.type="text";
}else{
x.type="password";
}

}

function showPass2(){

var x=document.getElementById("pass2");

if(x.type==="password"){
x.type="text";
}else{
x.type="password";
}

}

</script>

</body>

</html>
