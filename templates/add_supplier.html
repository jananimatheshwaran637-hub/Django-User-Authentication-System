{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            <h2>Add Supplier</h2>
        </div>


        <div class="card-body">


            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-success">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}



            <form method="POST">

                {% csrf_token %}


                <div class="mb-3">

                    <label>Name</label>

                    {{ form.name }}

                </div>



                <div class="mb-3">

                    <label>Phone</label>

                    {{ form.phone }}

                </div>



                <div class="mb-3">

                    <label>Email</label>

                    {{ form.email }}

                </div>



                <div class="mb-3">

                    <label>Address</label>

                    {{ form.address }}

                </div>



                <button type="submit" class="btn btn-success">

                    Save Supplier

                </button>


                <a href="{% url 'suppliers' %}" 
                   class="btn btn-secondary">

                    Back

                </a>


            </form>


        </div>

    </div>

</div>


{% endblock %}
