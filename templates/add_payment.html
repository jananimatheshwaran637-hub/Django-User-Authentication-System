{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Add Payment</h2>


    <div class="card mt-3">

        <div class="card-body">


            <form method="POST">

                {% csrf_token %}


                {{ form.as_p }}


                <button type="submit" class="btn btn-success">

                    Save Payment

                </button>


                <a href="{% url 'payments' %}" 
                   class="btn btn-secondary">

                    Back

                </a>


            </form>


        </div>

    </div>


</div>


{% endblock %}
