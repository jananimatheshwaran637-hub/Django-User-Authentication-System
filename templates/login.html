{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
background:#eef2f7;
font-family:Poppins,sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
width:900px;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 35px rgba(0,0,0,.2);
display:flex;
}

.left{
width:50%;
background:linear-gradient(135deg,#0d6efd,#00b4db);
color:white;
padding:50px;
display:flex;
flex-direction:column;
justify-content:center;
}

.left h1{
font-size:40px;
font-weight:bold;
}

.left p{
margin-top:20px;
font-size:17px;
}

.right{
width:50%;
padding:50px;
}

.form-control{
height:50px;
border-radius:10px;
}

.btn-login{
width:100%;
height:50px;
border-radius:10px;
font-size:18px;
}

@media(max-width:768px){

.login-box{
flex-direction:column;
width:95%;
}

.left,.right{
width:100%;
}

}

</style>

</head>

<body>

<div class="login-box">

<div class="left">

<h1>Nova ERP</h1>

<p>

Inventory Management System

</p>

<p>

Manage Products, Customers,
Purchase, Billing & Reports Easily.

</p>

</div>

<div class="right">

<h2 class="mb-4 text-center">

Login

</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username"
required>

</div>

<div class="mb-3">

<label>Password</label>

<div class="input-group">

<input
type="password"
id="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>

<button
type="button"
class="btn btn-outline-secondary"
onclick="showPassword()">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

<div class="d-flex justify-content-between mb-3">

<div>

<input type="checkbox">

Remember Me

</div>

<a href="#">

Forgot Password?

</a>

</div>

<button class="btn btn-primary btn-login">

Login

</button>

<div class="text-center mt-4">

Don't have an account?

<a href="{% url 'register' %}">

Register

</a>

</div>

</form>

</div>

</div>

<script>

function showPassword(){

var x=document.getElementById("password");

if(x.type==="password")

x.type="text";

else

x.type="password";

}

</script>

</body>

</html>
